services:
  calendar-proxy:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: radicale
    ports:
      - "127.0.0.1:5232:80"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50
#    healthcheck:
#      test: curl -f http://127.0.0.1:80 || exit 1
#      interval: 30s
#      retries: 3
    restart: unless-stopped
#    volumes:
#      - ./data:/data